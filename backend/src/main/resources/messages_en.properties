# ─── EduGlobin Backend — English Messages ────────────────────────────────────
# Used by Spring Validation + custom service-level error messages.

# Auth / Role
auth.role.mismatch=You are not authorised to log in through this portal. Please select the correct login tab.
auth.account.suspended=Your account has been suspended. Contact Eduglobin support.
auth.account.pending=Your account is awaiting admin approval.
auth.signup.staff.forbidden=Staff accounts are provisioned by administrators only. Contact your Eduglobin administrator.
auth.signup.admin.forbidden=Admin accounts cannot be self-registered.

# Library
library.not_found=Library not found.
library.slug.duplicate=A library with this name already exists. Please choose a different name.
library.not_published=This library is not yet published.

# Booking
booking.seat.unavailable=The selected seat is not available.
booking.conflict=You already have an active booking for this shift.
booking.locker.unavailable=The selected locker is not available.

# Complaint
complaint.sla.exceeded=Complaint SLA deadline cannot be in the past.

# Generic
validation.required={0} is required.
validation.invalid={0} is invalid.
error.server=An unexpected error occurred. Please try again.
