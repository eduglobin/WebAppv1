spring:
  application:
    name: eduglobin-backend

  # ── Datasource — Supabase Transaction Pooler ──────────────────────────
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      # Keep-alive important for Supabase connection pooler
      keepalive-time: 60000

  # ── Flyway ────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Security — OAuth2 Resource Server (Supabase JWT validation) ───────
  # Your project uses asymmetric ECC (P-256) signing keys.
  # We validate tokens using the public keys served at Supabase's JWKS endpoint.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256

  # ── Redis / Lettuce ───────────────────────────────────────────────────
  data:
    redis:
      url: ${UPSTASH_REDIS_URL:redis://localhost:6379}
      password: ${UPSTASH_REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  # ── Spring Data JDBC ──────────────────────────────────────────────────
  sql:
    init:
      mode: never  # Flyway handles all DDL

  # ── Bilingual Messages (EN / HI) ────────────────────────────────────────
  messages:
    basename: messages_en,messages_hi
    encoding: UTF-8
    cache-duration: -1

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false

# ── App-level config ──────────────────────────────────────────────────────
app:
  supabase:
    url: ${SUPABASE_URL}
    anon-key: ${SUPABASE_ANON_KEY}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    # jwt-secret no longer used; JWT validated via JWKS (ECC P-256)
  admin-seed:
    # These MUST live in secrets store only — never committed to git
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000
  redis:
    seat-lock-ttl-seconds: 300  # 5 minutes seat-lock TTL

# ── Server ────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.eduglobin: INFO
    org.springframework.security: DEBUG
