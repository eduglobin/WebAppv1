version: "3.9"

services:
  # ── Local PostgreSQL + PostGIS Database ─────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.3-alpine
    container_name: eduglobin-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduglobin}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Eduglobin2026@}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-eduglobin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Local Redis (Seat Locking Engine & Cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eduglobin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend Spring Boot Service (Port 8080) ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduglobin-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      UPSTASH_REDIS_URL: redis://redis:6379
      UPSTASH_REDIS_PASSWORD: ""
      REDIS_SSL_ENABLED: "false"
    depends_on:
      redis:
        condition: service_healthy

  # ── Frontend React Vite SPA (Port 5173 / Nginx 80) ──────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduglobin-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # ── Kong API Gateway (Port 8000) ────────────────────────────────────────────
  kong:
    image: kong:latest
    container_name: eduglobin-kong
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8443:8443"
      - "8444:8444"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/usr/local/kong/declarative/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
